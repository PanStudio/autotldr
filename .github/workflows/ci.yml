name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install the complete Python 3.12 environment
        run: |
          uv venv --python 3.12
          uv sync --locked --all-extras --dev
      - name: Run the warnings-as-errors acceptance suite
        run: uv run --no-sync pytest --durations=20 --junitxml=test-results.xml
      - name: Build and audit release artifacts
        run: |
          uv build --out-dir dist
          uv run --no-sync python scripts/check_release.py dist
      - name: Assemble the release bundle
        run: |
          uv run --no-sync python scripts/build_release_bundle.py \
            dist release-bundle \
            --support "private GitHub security advisory"
      - name: Retain test and release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ github.sha }}
          path: |
            test-results.xml
            dist/
            release-bundle*
          if-no-files-found: ignore
          retention-days: 14
