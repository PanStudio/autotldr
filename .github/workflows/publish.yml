name: Publish to PyPI

# A v* tag push builds and checks the release; the owner approves the pypi
# environment, then PyPI Trusted Publishing uploads the checked artifacts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the complete Python 3.12 environment
        run: |
          uv venv --python 3.12
          uv sync --locked --all-extras --dev
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(uv run --no-sync python -c 'import autotldr; print(autotldr.__version__)')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package version $VERSION"
            exit 1
          fi
      - name: Run the warnings-as-errors acceptance suite
        run: uv run --no-sync pytest
      - name: Build and audit release artifacts
        run: |
          uv build --out-dir dist
          uv run --no-sync python scripts/check_release.py dist
      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/autotldr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
